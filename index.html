<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="3;url=https://portfolio.gssriram.workers.dev">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This site has moved | Personal Portfolio</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #070b13;
      color: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 500px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    h1 {
      color: #42e8c8;
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }
    p {
      color: #a8b3c7;
      line-height: 1.6;
      margin-bottom: 1.25rem;
      font-size: 1rem;
    }
    .timer-text {
      color: #ffcb6b;
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 1.75rem;
    }
    #countdown {
      font-size: 1.25rem;
      color: #42e8c8;
    }
    a.btn {
      display: inline-block;
      background: linear-gradient(135deg, #42e8c8, #7c5cff);
      color: #070b13;
      font-weight: 700;
      padding: 0.9rem 2rem;
      border-radius: 30px;
      text-decoration: none;
      transition: transform 0.2s, opacity 0.2s;
    }
    a.btn:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>This site has moved</h1>
    <p>
      This personal portfolio has been upgraded to a full-stack web application hosted on Cloudflare Workers with Node.js, Express, and PostgreSQL.
    </p>
    <div class="timer-text">
      Redirecting automatically in <span id="countdown">3</span> seconds...
    </div>
    <a href="https://portfolio.gssriram.workers.dev" class="btn">Go to the new portfolio</a>
  </div>

  <script>
    if (window.location.hostname !== 'portfolio.gssriram.workers.dev') {
      let secondsLeft = 3;
      const countdownEl = document.getElementById('countdown');
      const timer = setInterval(function() {
        secondsLeft--;
        if (countdownEl) {
          countdownEl.textContent = secondsLeft;
        }
        if (secondsLeft <= 0) {
          clearInterval(timer);
          window.location.href = "https://portfolio.gssriram.workers.dev";
        }
      }, 1000);
    }
  </script>
</body>
</html>
